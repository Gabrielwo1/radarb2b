<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:0;background:#eef3fa;font-family:Helvetica,Arial,sans-serif;color:#141518;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#eef3fa;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:28px;overflow:hidden;">
            <tr>
              <td style="background:#2a2b2e;padding:28px 32px;">
                <span style="display:inline-block;background:#e3fc3f;color:#141518;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:bold;">radar b2b</span>
                <p style="margin:18px 0 0;color:#ffffff;font-size:24px;line-height:1.25;">Confirme seu e-mail para começar a prospectar</p>
              </td>
            </tr>
            <tr>
              <td style="padding:28px 32px;">
                <p style="margin:0 0 18px;font-size:15px;line-height:1.5;color:#3d4046;">Digite este código no Radar B2B para ativar sua conta:</p>
                <p style="margin:0 0 22px;text-align:center;">
                  <span style="display:inline-block;background:#e3fc3f;border-radius:18px;padding:14px 24px;font-size:34px;letter-spacing:10px;font-weight:bold;color:#141518;">{{ .Token }}</span>
                </p>
                <p style="margin:0 0 6px;font-size:13px;color:#8b9099;">O código vale por 1 hora. Se preferir, confirme pelo link:</p>
                <p style="margin:0 0 22px;font-size:13px;"><a href="{{ .ConfirmationURL }}" style="color:#141518;">Confirmar meu e-mail</a></p>
                <p style="margin:0;font-size:12px;color:#8b9099;">Se você não criou uma conta no Radar B2B, ignore este e-mail.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
